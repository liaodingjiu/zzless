<link rel="stylesheet" href="/shared.css">
<style>
.ag-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:600px;overflow-y:auto;border:1px solid rgba(134,168,231,0.15);border-radius:12px;padding:12px;background:rgba(134,168,231,0.02)}
.ag-card{background:var(--surface);border:1px solid rgba(134,168,231,0.2);border-radius:12px;padding:21px 12px 15px;text-align:center;transition:all .22s ease;cursor:pointer;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:center;position:relative}
.ag-card:hover{border-color:rgba(134,168,231,0.7);transform:translateY(-2px)}
.ag-card .ag-rank{position:absolute;top:8px;right:8px;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.ag-card .ag-icon{width:84px;height:84px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:10px;border:2px solid rgba(134,168,231,0.2)}
.ag-card .ag-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ag-card .ag-faction{font-size:13px;color:#556677;margin-top:2px}
.ag-card .ag-spec{font-size:13px;color:#8899aa;margin-top:2px}
.r-s{background:rgba(249,211,102,0.2);color:#F9D366}.r-a{background:rgba(192,132,252,0.2);color:#c084fc}
.ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.ag-bar input{flex:1;min-width:160px;max-width:320px;padding:8px 14px;border:1px solid rgba(134,168,231,0.3);border-radius:12px;background:var(--surface);color:#fff;font-size:15px}
.ag-bar input:focus{outline:none;border-color:#86a8e7}
.ag-bar select{padding:8px 12px;border:1px solid rgba(134,168,231,0.3);border-radius:12px;background:var(--surface);color:#fff;font-size:14px}
.ag-bar .ag-count{font-size:14px;color:#8899aa;white-space:nowrap}
.ag-hero{text-align:center;padding:24px 0 8px}
.ag-hero h1{font-size:32px;font-weight:600}.ag-hero h1 span{color:#F9D366}
.ag-hero .ag-sub{font-size:15px;color:#8899aa}
@media(max-width:1200px){.ag-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.ag-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.ag-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "xl629udfvo");</script></head>
<body>
<nav aria-label="Main navigation"><div class="nav-inner"><a href="/" class="logo">ZZZ<span>DB</span></a><button class="hamburger" id="hb" aria-label="Menu">☰</button><div class="nav-right"><ul class="nav-links" id="nl"><li><a href="/tier-list/">Tier List</a></li><li><a href="/agents/">Agents</a></li><li><a href="/w-engines/">W-Engines</a></li><li><a href="/drive-discs/">Drive Discs</a></li><li><a href="/bangboo/">Bangboo</a></li><li><a href="/build-planner/" class="nav-highlight">Builder</a></li><li><a href="/codes/">Codes</a></li><li><a href="/items/">Items</a></li></ul><button class="theme-toggle">EN ▾</button></div></div></nav>
<main class="container" style="max-width:1500px">
<header class="ag-hero"><h1>Zenless Zone Zero <span>Agents</span></h1><p class="ag-sub" id="agSub">All 37 playable agents with elements, specialties, and factions.</p></header>
<div class="ag-bar">
  <input type="text" id="s" placeholder="Search agents..." autocomplete="off">
  <span class="ag-count" id="c">37/37</span>
  <select id="rank"><option value="all">All Ranks</option><option value="S">S-Rank</option><option value="A">A-Rank</option></select>
  <select id="element"><option value="all">All Elements</option><option value="Fire">Fire 🔥</option><option value="Electric">Electric ⚡</option><option value="Ice">Ice ❄️</option><option value="Physical">Physical 💪</option><option value="Ether">Ether ✨</option></select>
  <select id="specialty"><option value="all">All Specialties</option><option>Attack</option><option>Stun</option><option>Anomaly</option><option>Support</option><option>Defense</option><option>Rupture</option></select>
</div>
<div class="ag-grid" id="g"></div>
</main>
<footer class="site-footer"><div class="footer-inner"><p>&copy; 2026 ZZZ Database. Not affiliated with HoYoverse.</p><div class="footer-links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></div></div></footer>
<script src="/agents/agents-data.js"></script>
<script>
var D=window.__AGENTS__||[];
function render(l){
  document.getElementById('c').textContent=l.length+'/'+D.length;
  document.getElementById('g').innerHTML=l.map(function(a){
    return '<a href="/agents/'+a.s+'/" class="ag-card">'+
      '<span class="ag-rank r-'+(a.r==='S'?'s':'a')+'">'+(a.r==='S'?'S':'A')+'</span>'+
      '<div class="ag-icon"><img src="/images/agents/'+a.s+'.png" alt="'+a.n+'" style="width:100%;height:100%;object-fit:contain;border-radius:8px"></div>'+
      '<span class="ag-name">'+a.n+'</span>'+
      '<span class="ag-faction">'+a.f+'</span>'+
      '<span class="ag-spec">'+a.sp+'</span>'+
    '</a>';
  }).join('');
}
function filter(){
  var q=document.getElementById('s').value.toLowerCase(),r=document.getElementById('rank').value,el=document.getElementById('element').value,sp=document.getElementById('specialty').value;
  var l=D.filter(function(a){if(r!=='all'&&a.r!==r)return false;if(el!=='all'&&a.e!==el)return false;if(sp!=='all'&&a.sp!==sp)return false;if(q&&a.n.toLowerCase().indexOf(q)<0)return false;return true});
  l.sort(function(a,b){if(a.r!==b.r)return a.r==='S'?-1:1;return a.n.localeCompare(b.n)});
  render(l);
}
document.getElementById('s').addEventListener('input',filter);
document.getElementById('rank').addEventListener('change',filter);
document.getElementById('element').addEventListener('change',filter);
document.getElementById('specialty').addEventListener('change',filter);
document.getElementById('hb').addEventListener('click',function(){document.getElementById('nl').classList.toggle('open')});
render(D.sort(function(a,b){if(a.r!==b.r)return a.r==='S'?-1:1;return a.n.localeCompare(b.n)}));
</script>
</body>
</html>
