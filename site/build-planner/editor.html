<script src="/agents/agents-data.js"></script><script src="/w-engines/wengines-data.js"></script><script>
var A=window.__AGENTS__||[],W=window.__WENGINES__||[];
var p=new URLSearchParams(location.search),slug=p.get("agent")||"miyabi";
var agent=A.find(function(a){return a.s===slug})||A[0];
document.getElementById("charDisplay").innerHTML='<h1>Build Planner: <span style="color:#F9D366">'+agent.n+'</span></h1><p style="color:#8899aa">'+agent.e+' | '+agent.sp+' | '+agent.f+'</p>';
document.getElementById("charCard").innerHTML='<div class="ed-card"><div class="ed-icon"><img src="/images/agents/'+agent.s+'.png" alt="'+agent.n+'"></div><h2>'+agent.n+'</h2><p style="color:#8899aa">'+(agent.r==="S"?"S-Rank":"A-Rank")+' | '+agent.e+' | '+agent.sp+'</p></div>';
W.forEach(function(w){var o=document.createElement("option");o.value=w.s;o.textContent=(w.r==="S"?"S":"A")+" "+w.n+" (ATK "+w.a+")";document.getElementById("wpn").appendChild(o)});
document.getElementById("wpn").addEventListener("change",function(){var w=W.find(function(x){return x.s===this.value});if(w){document.getElementById("wpnInfo").innerHTML="Substat: "+w.sub+" "+w.sv;compute()}else compute()});
var discs=["Woodpecker Electro","Inferno Metal","Polar Metal","Thunder Metal","Swing Jazz","Shockstar Disco","Freedom Blues","Soul Rock","Hormone Punk","Chaos Jazz","Astral Voice","Fanged Metal","Chaotic Metal","Proto Punk","Branch & Blade Song"];
for(var i=0;i<6;i++){var d=document.createElement("div");d.style.cssText="display:flex;gap:6px;align-items:center;margin-bottom:6px";d.innerHTML='<span style="font-size:11px;font-weight:700;color:#F9D366;width:28px">#'+(i+1)+'</span><select id=d'+i+' style="flex:1;padding:8px;border:1px solid rgba(134,168,231,0.3);border-radius:8px;background:var(--bg);color:#fff;font-size:13px"><option value="">--</option>'+discs.map(function(d){return'<option>'+d+'</option>'}).join("")+'</select>';d.querySelector("select").addEventListener("change",compute);document.getElementById("discSlots").appendChild(d)}
function compute(){var w=W.find(function(x){return x.s===document.getElementById("wpn").value});var wAtk=w?w.a:0,atkPct=0,cr=5,cd=50;for(var i=0;i<6;i++){if(document.getElementById("d"+i).value){atkPct+=2;cr+=2;cd+=4}}if(w&&w.r==="S"){atkPct+=10;cr+=5;cd+=8}var total=Math.round((400+wAtk)*(1+atkPct/100));document.getElementById("sAtk").textContent=total;document.getElementById("sCr").textContent=Math.min(cr,100)+"%";document.getElementById("sCd").textContent=cd+"%";document.getElementById("sElem").textContent=(w&&w.r==="S"?10:0)+"%"}
document.getElementById("hb").addEventListener("click",function(){document.getElementById("nl").classList.toggle("open")});compute();
</script></body></html>
